# Desarrollo local: docker compose up --build  →  http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mirenta
      POSTGRES_USER: mirenta
      POSTGRES_PASSWORD: mirenta
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirenta"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/mirenta
      DATABASE_USER: mirenta
      DATABASE_PASSWORD: mirenta
      AUTH_MODO: demo
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
